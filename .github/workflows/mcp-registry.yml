# Lists dbboard-mcp in the official MCP Registry (ADR-0168).
#
# The registry (https://registry.modelcontextprotocol.io) is where MCP
# clients and directories look a server up. It reads `server.json` at the
# repository root, which names the server and the release it is at;
# `scripts/mcp-registry.test.mjs` holds that version to the app's, and
# `scripts/release-cut.mjs` bumps it with the rest.
#
# It runs after the release workflow has published a tag, so the listing
# never names a release whose downloads are not there yet. It can also be
# run by hand, for the first listing or to retry one: it then publishes
# whatever `server.json` on the default branch names, and only if that
# version has a published GitHub release.
#
# No secret is stored. `id-token: write` lets the job prove, through
# GitHub's OIDC token, that it runs in a `meta-taro` repository, which is
# what the `io.github.meta-taro/` namespace requires.

name: mcp-registry

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # A release run for a tag push that succeeded; a dispatch always. The
    # release workflow's own dispatch is a smoke build with no tag, and its
    # head_branch is a branch name, not `v…`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: server.json
          sparse-checkout-cone-mode: false

      - name: Check the version against the tag and the release
        id: version
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          HAVE="$(jq -r .version server.json)"
          if [ -n "$TAG" ] && [ "v$HAVE" != "$TAG" ]; then
            echo "::error::server.json says $HAVE but the tag is $TAG"
            exit 1
          fi
          # Listing a version whose downloads do not exist would send people
          # to a release page that is not there.
          if ! gh release view "v$HAVE" --json tagName >/dev/null; then
            echo "::error::there is no published release v$HAVE to list"
            exit 1
          fi
          echo "version=$HAVE" >> "$GITHUB_OUTPUT"

      - name: See whether the registry already lists it
        id: listed
        env:
          WANT: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          # An unreadable registry is a failure, not "not listed": guessing
          # would publish twice, and a green run that did nothing reads as
          # done.
          BODY=""
          for wait in 0 30 60 120; do
            [ "$wait" = 0 ] || sleep "$wait"
            BODY="$(curl -fsS --max-time 20 \
              'https://registry.modelcontextprotocol.io/v0/servers?search=io.github.meta-taro/dbboard' \
              || true)"
            [ -n "$BODY" ] && break
            echo "the registry did not answer; trying again"
          done
          if [ -z "$BODY" ]; then
            echo "::error::the registry could not be read, so nothing was published. Re-run this workflow once it answers."
            exit 1
          fi
          NOW="$(echo "$BODY" | jq -r \
            '.servers[] | select(.server.name == "io.github.meta-taro/dbboard")
             | select(._meta["io.modelcontextprotocol.registry/official"].isLatest)
             | .server.version' | head -1)"
          echo "listed now: ${NOW:-(nothing)}"
          if [ "$NOW" = "$WANT" ]; then
            echo "$WANT is already listed; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mcp-publisher
        if: steps.listed.outputs.skip != 'true'
        run: |
          set -eu
          # Pinned, so a new publisher release cannot change what a tag push
          # does on the day of a release.
          VER=1.8.1
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${VER}/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --version

      - name: Publish
        if: steps.listed.outputs.skip != 'true'
        run: |
          set -eu
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
