# Verification (ADR-0104).
#
# Until now the only CI on this repo was `pii-scan` (leak defence) and
# `release` (tag-triggered builds). Every command in CLAUDE.md's "Mandatory
# Verification Commands" ran *only* in a local git hook, which means the repo
# was one `--no-verify` — or one machine without the hooks installed — away
# from an unverified merge. This workflow runs the same commands on the
# integration branches so a PR carries its own evidence.
#
# The three jobs mirror the three toolchains in the tree:
#   * rust     — fmt / clippy / check / test across the whole workspace.
#   * frontend — svelte-check and vitest, from apps/desktop.
#   * site     — node --test over the download page's tests.
#
# Why the rust job builds the frontend first: `apps/desktop/src-tauri` is a
# workspace member, and its build script resolves `frontendDist: ../build`,
# which is a build artefact and therefore not in the tree. `pnpm build` is
# cheaper than excluding the crate and losing coverage of every Tauri command.
#
# Why the Linux runner even though the app ships for Windows and macOS: the
# release workflow already builds the desktop bundle on both of those. What is
# missing is the *verification* pass, and running it on Linux avoids the known
# Windows libSQL teardown segfault (docs/maintainer/, issue #131) that would
# otherwise make this job permanently red on green code. Every environment-
# dependent test in the workspace is `#[ignore]`d, so no service is needed.
#
# Security posture (CLAUDE.md "Adding GitHub Actions workflows"): least
# privilege — `contents: read` only, no secrets are read, and only first-party
# actions (`actions/checkout`, `actions/setup-node`, `actions/cache`) pinned by
# major tag. pnpm comes from corepack via the `packageManager` field rather
# than a third-party setup action.
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail rather than hang if a dependency needs an interactive prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # The cached `target` reached 8.92 GiB, against GitHub's 10 GiB per-repo
  # cache quota — so every save evicted every other entry, and the next run
  # restored a partial match and rebuilt anyway. Nearly all of that bulk is
  # debug info nothing here reads: CI opens no debugger and no test asserts on
  # a symbolicated backtrace. Dropping it keeps the cache inside the quota and
  # takes about three minutes of tar off each run.
  CARGO_PROFILE_DEV_DEBUG: "false"
  CARGO_PROFILE_TEST_DEBUG: "false"

jobs:
  rust:
    name: rust (fmt / clippy / check / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The packages below are 89.3 MB, which the Azure Ubuntu mirror has been
      # serving at ~163 kB/s: 9m09s of a 16m46s job before a single crate is
      # compiled (measured on run 32224336075, and the dominant term in every
      # run since — the rate varies run to run, which is why the job's total
      # does). The set only changes when this file does, so the .debs are
      # cached and a hit skips the network entirely.
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # Tauri 2 links against the system webkit/gtk stack. Without these the
      # desktop crate does not compile and the whole workspace check fails.
      #
      # The last three are for `xcap` (dbboard-mcp's capture_window, ADR-0108).
      # xcap declares `pipewire` for every non-OHOS Linux target with no feature
      # gate, so `default-features = false` cannot avoid it — the only way to
      # keep the workspace checking on Linux is to have the .pc files present.
      # libspa-sys runs bindgen, which needs libclang at build time; libspa's
      # pkg-config then asks the linker for -lgbm, which no other dependency
      # here brings in. Both were found by CI failing, one per round: there is
      # no Linux machine in this project's loop to resolve the chain locally.
      - name: Install Tauri system dependencies
        # apt downloads as `_apt` but actions/cache reads as `runner`, so the
        # archive directory's ownership is handed over and back around the
        # install. Without the handback the post-job save silently caches
        # nothing and every run pays the download again.
        run: |
          sudo mkdir -p ~/apt-archives/partial
          sudo chown -R _apt:root ~/apt-archives
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            -o Dir::Cache::archives="$HOME/apt-archives" \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libgbm-dev \
            patchelf
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable

      # Only to produce ../build for the Tauri build script; the frontend's own
      # checks live in the `frontend` job.
      - name: Build frontend (required by the Tauri build script)
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo check
        run: cargo check --all-targets --all-features

      - name: cargo test
        run: cargo test --all-features

  # `cargo deny check` existed in this repo, and CLAUDE.md named it as part of
  # the security posture, but nothing ran it. It was red for months without
  # anyone finding out: 21 advisories and 4 license failures, discovered only
  # because a pre-release review happened to run it by hand. A check that lives
  # only in a person's memory is not a check.
  #
  # It gets its own job rather than a step in `rust` because it needs neither
  # the GTK stack nor a frontend build — `cargo metadata` resolves the graph
  # without compiling anything — so it finishes in a fraction of that job's
  # time and reports separately when it is the thing that broke.
  deps:
    name: deps (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Pinned, and cached on that pin: an unpinned install would change the
      # advisory database's client from under a passing branch, and building
      # cargo-deny from source costs more than the check it performs.
      - name: Cache cargo-deny
        id: cache-deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.19.7

      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny@0.19.7

      # All four checks. `advisories` and `licenses` are the ones that were
      # failing; `bans` and `sources` are cheap and were already green.
      - name: cargo deny check
        run: cargo deny check

  frontend:
    name: frontend (svelte-check / vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm run check

      - name: vitest
        run: pnpm run test

  site:
    name: site (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Discovered, not listed. These tests are added one file at a time and a
      # hard-coded list silently stops covering the ones added after it was
      # written. `apps/` is excluded because vitest owns that tree (the
      # `frontend` job runs it); node's own runner would try to load Svelte.
      # Node 22 does not recurse into a bare directory argument, so the file
      # list has to be produced here rather than handed to `--test`.
      - name: node --test
        run: |
          FILES=$(find . -name '*.test.mjs' \
            -not -path './apps/*' \
            -not -path './target/*' \
            -not -path '*/node_modules/*' | sort)
          if [ -z "$FILES" ]; then
            echo "no *.test.mjs outside apps/ — nothing to run"
            exit 0
          fi
          echo "$FILES"
          # shellcheck disable=SC2086  # word splitting is the point
          node --test $FILES
