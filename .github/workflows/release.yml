# Release build + checksums (ADR-0044) + Tauri auto-update manifest (ADR-0067).
#
# Pushing a `v*.*.*` tag builds the distributable artifacts on their native
# runners and publishes them to the matching GitHub Release together with a
# combined SHA256SUMS.txt. A manual `workflow_dispatch` run builds the same
# artifacts as a smoke test but does NOT publish (there is no tag to attach
# to). Checksums are the highest-leverage trust signal for an OSS binary:
# anyone can verify a download against the value the CI computed.
#
# Two product lines ship from the same tag: the egui binary (build-windows /
# build-macos → .exe/.msi/.dmg) and the Tauri desktop app (build-tauri-* →
# NSIS setup .exe / .dmg plus the updater's signed `.app.tar.gz`/`.sig`). The
# publish job additionally assembles `latest.json` — the manifest
# tauri-plugin-updater fetches to discover + verify a newer build (ADR-0067).
#
# NOT signed yet. Windows artifacts trip SmartScreen ("unknown publisher")
# and the macOS .app trips Gatekeeper until code signing + notarization are
# wired (ADR-0044 §Future / needs paid certs + repo secrets). The signing
# steps are left as commented placeholders below so the wiring is obvious.
#
# Security posture (CLAUDE.md "Adding GitHub Actions workflows"): least
# privilege — the workflow defaults to read-only and `contents: write` is
# granted ONLY to the publish job (the build jobs run untrusted crates.io
# build.rs/proc-macro code via `cargo build`/`cargo install`, so they must
# never hold a write-scoped token). No third-party release action (the
# publish step uses the runner-bundled `gh` CLI with the built-in
# GITHUB_TOKEN), and first-party actions are pinned by major tag.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Read-only by default; the publish job re-grants `contents: write` for
# itself only.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # persist-credentials: false — this job runs untrusted build-time code
      # (cargo build / cargo install) and never pushes, so it must not leave a
      # GITHUB_TOKEN wired into the git credential helper.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build release binary
        run: cargo build --release --package dbboard

      # WiX v3 (candle/light) + cargo-wix; see ADR-0032 / ADR-0044. choco is
      # preinstalled on windows runners. cargo-wix is pinned so a template
      # regeneration cannot silently change the installer shape.
      - name: Install WiX Toolset v3 + cargo-wix
        run: |
          choco install wixtoolset --version=3.14.1 --no-progress -y
          cargo install cargo-wix --version 0.3.9 --locked

      # Run from the package dir: main.wxs references `assets\dbboard.ico`
      # and `wix\License.rtf` relative to apps/dbboard (the light linker
      # resolves SourceFile against the CWD). Output still lands in the
      # workspace target/wix/.
      - name: Build MSI
        working-directory: apps/dbboard
        run: cargo wix --package dbboard --nocapture

      - name: Stage artifacts + checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/dbboard.exe dist/dbboard-windows-x86_64.exe
          Copy-Item (Get-ChildItem target/wix/*.msi | Select-Object -First 1) dist/
          Get-ChildItem dist | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name |
              Out-File -Append -Encoding ascii dist/SHA256SUMS.windows.txt
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  build-macos:
    runs-on: macos-latest
    steps:
      # See build-windows: no push, untrusted build code → drop the token.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build release binary
        run: cargo build --release --package dbboard

      # cargo-bundle reads [package.metadata.bundle] to produce the .app
      # (ADR-0044). Pinned for the same reason as cargo-wix above.
      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.6.0 --locked

      # cargo-bundle 0.6.0 can't build this crate as-is: it has no package
      # selector (`--package` is rejected, so we run in the crate dir) AND it
      # can't read a workspace-inherited version — `version.workspace = true`
      # is a TOML map and it wants a string ("invalid type: map, expected a
      # string for key `package.version`"). Resolve the concrete version via
      # cargo metadata (which *does* understand inheritance), inline it into
      # this crate's manifest for the bundle only, then restore the manifest.
      # The .app still lands in the shared workspace target/ the .dmg reads.
      - name: Bundle .app
        working-directory: apps/dbboard
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys,json; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="dbboard"))')"
          cp Cargo.toml Cargo.toml.orig
          sed -i '' 's/^version\.workspace = true/version = "'"$VERSION"'"/' Cargo.toml
          cargo bundle --release
          mv Cargo.toml.orig Cargo.toml

      # Wrap the .app in a compressed .dmg with hdiutil (built into macOS —
      # no extra tooling). The .app path is fixed by cargo-bundle.
      - name: Build .dmg
        run: |
          APP="target/release/bundle/osx/dbboard.app"
          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys,json; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="dbboard"))')"
          mkdir -p dist
          hdiutil create -volname dbboard -srcfolder "$APP" -ov -format UDZO \
            "dist/dbboard-macos-universal-${VERSION}.dmg"

      # TODO(signing): before the dmg step, sign the .app, then notarize +
      # staple. Needs repo secrets (Developer ID cert .p12 + password, Apple
      # ID / team / app-specific password). ADR-0044 §Future.
      #   codesign --deep --force --options runtime --sign "$DEVELOPER_ID" "$APP"
      #   xcrun notarytool submit ... --wait && xcrun stapler staple "$APP"

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS.macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  # --- Tauri desktop app (v0.4.0 parity + auto-update, ADR-0067) ----------
  #
  # Builds the Tauri bundles and, because tauri.conf.json sets
  # createUpdaterArtifacts, the matching minisign `.sig` files the updater
  # verifies. Signing happens here at build time (the updater's design requires
  # it): the PRIVATE key arrives via the TAURI_SIGNING_PRIVATE_KEY secret and
  # never touches the repo. NOTE: this hands a signing key to a job that also
  # runs untrusted crates.io build code — an accepted trade-off inherent to the
  # updater flow (and exactly what tauri-action does). It is the *updater*
  # signing key only; it never code-signs the binary, so OS code signing stays
  # deferred (ADR-0044 §Future) and these bundles still trip SmartScreen /
  # Gatekeeper. Rust is preinstalled on the runners (as with the egui jobs);
  # only Node + pnpm (via corepack) are added.
  build-tauri-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm via corepack
        run: corepack enable
      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      # `pnpm tauri build` runs the pinned @tauri-apps/cli devDep. With the
      # signing env set + createUpdaterArtifacts, the NSIS setup .exe lands in
      # the workspace target/ alongside its `.exe.sig`.
      - name: Build Tauri bundle (NSIS + updater .sig)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
      - name: Stage artifacts + checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1) dist/
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*-setup.exe.sig | Select-Object -First 1) dist/
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name |
              Out-File -Append -Encoding ascii dist/SHA256SUMS.tauri-windows.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: dist/

  build-tauri-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm via corepack
        run: corepack enable
      # A universal binary serves both darwin arches from one artifact, so both
      # rustup targets must be present before the bundle step.
      - name: Add both macOS Rust targets (universal build)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Build Tauri universal bundle (.dmg + updater .app.tar.gz + .sig)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin
      - name: Stage artifacts + checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          base=target/universal-apple-darwin/release/bundle
          cp "$base"/dmg/*.dmg dist/
          cp "$base"/macos/*.app.tar.gz dist/
          cp "$base"/macos/*.app.tar.gz.sig dist/
          cd dist
          shasum -a 256 *.dmg *.app.tar.gz > SHA256SUMS.tauri-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-macos
          path: dist/

  publish:
    needs: [build-windows, build-macos, build-tauri-windows, build-tauri-macos]
    # Only publish for a real tag *push*. Checking event_name as well as
    # ref_type is load-bearing: a manual workflow_dispatch run can also be
    # aimed at an existing tag (via the "Run workflow" ref picker or
    # `gh workflow run --ref <tag>`), where ref_type is likewise 'tag'. Without
    # the event_name guard, such a re-run would fall through to the --clobber
    # upload below and silently overwrite the already-published, checksummed
    # assets of a released tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The only job that writes: re-grant the release-upload scope here so the
    # build jobs stay read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Assemble release assets + combined checksums
        run: |
          set -euo pipefail
          mkdir -p out
          # cp -n (no-clobber): today's per-platform names don't collide, but a
          # future Linux/ARM artifact reusing a filename must fail loudly here
          # rather than silently drop a binary from the release. The count check
          # below turns any skipped (would-be-clobbered) file into a hard error.
          find staged -type f ! -name 'SHA256SUMS.*.txt' -exec cp -n {} out/ \;
          expected=$(find staged -type f ! -name 'SHA256SUMS.*.txt' | wc -l)
          actual=$(find out -type f | wc -l)
          if [ "$expected" -ne "$actual" ]; then
            echo "::error::artifact filename collision: staged $expected files but out/ has $actual" >&2
            exit 1
          fi
          cat staged/*/SHA256SUMS.*.txt > out/SHA256SUMS.txt
          ls -la out
          cat out/SHA256SUMS.txt

      # Build latest.json — the manifest tauri-plugin-updater fetches from the
      # release. It carries, per platform, the `.sig` contents plus the static
      # download URL of the bundle (the URL is predictable from the tag, so the
      # manifest can be built before the release object exists). One universal
      # macOS artifact serves both darwin arches. `one()` fails loudly if a
      # bundle is missing so a half-built release never ships a broken manifest.
      - name: Assemble the updater manifest (latest.json)
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          GH_REF_NAME="${GH_REF_NAME}" GH_REPO="${GH_REPO}" python3 - <<'PY'
          import glob, json, os, sys

          tag = os.environ["GH_REF_NAME"]
          repo = os.environ["GH_REPO"]
          version = tag[1:] if tag[:1] in "vV" else tag
          base = f"https://github.com/{repo}/releases/download/{tag}"

          def one(pattern):
              hits = glob.glob(pattern)
              if len(hits) != 1:
                  sys.exit(f"::error::expected exactly one {pattern}, got {hits}")
              return hits[0]

          def sig(path):
              with open(path, encoding="utf-8") as fh:
                  return fh.read().strip()

          win = one("out/*-setup.exe")
          win_sig = one("out/*-setup.exe.sig")
          mac = one("out/*.app.tar.gz")
          mac_sig = one("out/*.app.tar.gz.sig")

          mac_entry = {"signature": sig(mac_sig), "url": f"{base}/{os.path.basename(mac)}"}
          doc = {
              "version": version,
              "notes": f"dbboard {tag}. See the release page for the full changelog.",
              "pub_date": os.environ["PUB_DATE"],
              "platforms": {
                  "windows-x86_64": {
                      "signature": sig(win_sig),
                      "url": f"{base}/{os.path.basename(win)}",
                  },
                  "darwin-x86_64": mac_entry,
                  "darwin-aarch64": mac_entry,
              },
          }
          with open("out/latest.json", "w", encoding="utf-8") as fh:
              json.dump(doc, fh, indent=2)
          PY
          cat out/latest.json

      # `gh release upload` will NOT create the release object — it 404s if the
      # tag has no release yet. Bootstrap it first (idempotent: view-or-create),
      # then upload. Without this the very first publish for a tag fails.
      - name: Ensure the release object exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
                 --title "${GITHUB_REF_NAME}" --generate-notes

      # Runner-bundled gh CLI + built-in token; no third-party release
      # action. `--clobber` makes re-runs idempotent.
      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" --clobber
