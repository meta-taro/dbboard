[package]
name = "dbboard-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Resolve dbboard connection config + keyring secrets into a connected database adapter (axum-free factory, ADR-0046)."

[dependencies]
dbboard-core = { workspace = true }
# connections.toml + OS keychain resolution (ADR-0013): entries and
# secret refs come in, a BackendConfig comes out.
dbboard-config = { workspace = true }
# Concrete adapters wired by the match in `backend.rs`. Depended on by
# path (not workspace deps) exactly as `dbboard-server` did before the
# ADR-0046 extraction.
dbboard-d1 = { path = "../dbboard-d1" }
dbboard-firestore = { path = "../dbboard-firestore" }
dbboard-mysql = { path = "../dbboard-mysql" }
dbboard-postgres = { path = "../dbboard-postgres" }
dbboard-turso = { path = "../dbboard-turso" }
# SSH local-forward tunnel (ADR-0069). The factory opens a tunnel for a
# connection whose entry carries an `[ssh]` block and rewrites its URL to the
# loopback forward, then wraps the adapter so the tunnel lives as long as it.
dbboard-tunnel = { workspace = true }
# Rewrite a database URL's host:port to the loopback forward (ADR-0069).
url = { workspace = true }
# TunneledAdapter delegates the async DatabaseAdapter surface to its inner
# adapter; the trait is async_trait exactly like the concrete adapters.
async-trait = { workspace = true }

[dev-dependencies]
# Async delegation tests for TunneledAdapter.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
