# Tauri 2 + SvelteKit spike (spike/tauri-sveltekit). Proves the WebView↔core
# path by wrapping the already-transport-agnostic McpService (config + keychain
# + adapter + read-only query) in Tauri commands. No new DB logic lives here.
[package]
name = "dbboard-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Tauri takes the main-binary + shared-lib shape (the lib is what mobile /
# tests would link); we keep it for parity with the reference stack even though
# the spike is desktop-only.
[lib]
name = "dbboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native save/open dialogs for the connection-bundle import/export (ADR-0038).
# The picked path is handed to a Rust command that does the file I/O itself, so
# the encrypted blob and passphrase never round-trip through the WebView.
tauri-plugin-dialog = "2"
# Auto-update (ADR-0067): the updater fetches a signed `latest.json` from the
# GitHub release, verifies the minisign signature against the embedded pubkey,
# then downloads + installs the newer bundle. `process` gives the frontend the
# `relaunch()` it calls after a successful install. Both are desktop-only.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The spike's whole backend: the read-only service the MCP server already
# uses, plus the OS keychain store it reads secrets from. Same crates, new
# transport (Tauri IPC instead of stdio JSON-RPC).
dbboard-mcp = { path = "../../../crates/dbboard-mcp" }
dbboard-config = { path = "../../../crates/dbboard-config" }
# Command return types (TableInfo / TableSchema) live in the domain crate;
# the frontend consumes them as JSON, so they cross the Tauri boundary here.
dbboard-core = { path = "../../../crates/dbboard-core" }
# AI assistant vertical (ADR-0052): the I/O-free provider trait plus the two
# concrete providers, wired exactly as the egui app wires them. The
# AiSettingsAdmin + keyring store it reads from already ship in dbboard-config
# above; only the provider crates are new here.
dbboard-ai = { path = "../../../crates/dbboard-ai" }
dbboard-anthropic = { path = "../../../crates/dbboard-anthropic" }
dbboard-openai = { path = "../../../crates/dbboard-openai" }
# Consumes the provider's normalized StreamEvent stream (StreamExt::next)
# inside the ai_explain/ai_suggest commands as they emit `ai:chunk` events.
futures-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
