[workspace]
resolver = "2"
members = [
    # The one client (ADR-0089): a Tauri 2 + SvelteKit shell over the core
    # crates. The egui app that used to sit beside it was retired at v0.4.0.
    "apps/desktop/src-tauri",
    "crates/dbboard-ai",
    "crates/dbboard-anthropic",
    # Dev-only measurement harness (ADR-0141). Nothing links it; it is a tool.
    "crates/dbboard-bench",
    "crates/dbboard-config",
    "crates/dbboard-connect",
    "crates/dbboard-core",
    "crates/dbboard-d1",
    "crates/dbboard-firestore",
    "crates/dbboard-mcp",
    "crates/dbboard-mongodb",
    "crates/dbboard-mysql",
    "crates/dbboard-openai",
    "crates/dbboard-postgres",
    "crates/dbboard-server",
    "crates/dbboard-tunnel",
    "crates/dbboard-turso",
]

[workspace.package]
version = "0.15.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/meta-taro/dbboard"
# Raised from 1.75 to 1.92 by egui_commonmark 0.23 (ADR-0043). That crate left
# with the egui client (ADR-0089); the floor stays where it is rather than
# being lowered to a guess, since nothing is published from here and the
# maintainer builds on current stable.
rust-version = "1.92"
# This is a binary project; the supporting crates are internal and never
# published to crates.io. Each member opts in with `publish.workspace = true`.
publish = false

[workspace.dependencies]
dbboard-core = { path = "crates/dbboard-core" }
# Optional AI integration layer (ADR-0023). The trait crate defines the
# `AiProvider` surface; concrete providers (Anthropic, …) live in
# sibling crates that depend on this one only.
dbboard-ai = { path = "crates/dbboard-ai" }
# First concrete AI provider — talks to the Anthropic Messages API over
# `reqwest` (ADR-0023). The binary depends on this only when AI is
# wired in (Stage 1 wiring follows in a sibling PR).
dbboard-anthropic = { path = "crates/dbboard-anthropic" }
# Second concrete AI provider — talks to the OpenAI Chat Completions API
# (ADR-0052). Same dependency rule as dbboard-anthropic: depends on
# dbboard-ai only, mirrors its provider + SSE-stream shape.
dbboard-openai = { path = "crates/dbboard-openai" }
# Local user configuration: connections.toml + OS keychain (ADR-0013).
# The connection factory depends on this to wire env-vars with the
# file-backed store into a single BackendConfig resolution.
dbboard-config = { path = "crates/dbboard-config" }
# Connection factory (ADR-0046): BackendConfig resolution + adapter
# construction, extracted from dbboard-server so the headless MCP server
# reuses it without depending on axum. dbboard-server re-exports it.
dbboard-connect = { path = "crates/dbboard-connect" }
# MySQL adapter (ADR-0068): a genuinely new SQL dialect (back-tick quoting,
# backslash-escaped literals) over sqlx's mysql driver. Depends on
# dbboard-core only, mirroring the Postgres-wire adapter's shape.
dbboard-mysql = { path = "crates/dbboard-mysql" }
# Cloud Firestore adapter (ADR-0093): a read-only HTTP client of the
# Firestore REST API. Depends on dbboard-core only, like every other
# adapter. Read-only is structural — the crate builds no URL that can
# write, so there is no classifier to get wrong (ADR-0091).
dbboard-firestore = { path = "crates/dbboard-firestore" }
# MongoDB adapter (issue 0020). Firestore's read-only guarantee is structural;
# this one cannot be, because every MongoDB command travels the same
# `runCommand` path. So the crate leads with a classifier — an allowlist of
# read commands that also walks the document for writing aggregation stages —
# and the adapter is built on top of it, not beside it.
dbboard-mongodb = { path = "crates/dbboard-mongodb" }
# SSH local-forward tunnel (ADR-0069): a pure-Rust SSH client (russh) that
# opens a bastion-gated database's port on a loopback address so the ordinary
# TCP adapters connect through it. Leaf crate — depends on russh + tokio only,
# never on dbboard-core. Host-key verification is mandatory (Fingerprint pin
# or known_hosts); there is no blind-accept path.
dbboard-tunnel = { path = "crates/dbboard-tunnel" }
thiserror = "2"
# Pure SQL parser for the read-only classifier (ADR-0046, Decision 6).
# dbboard-core walks the parsed AST to prove a statement is a single
# read-only query — the primary enforcement for Cloudflare D1 (which has
# no server-side read-only mode) and defense-in-depth for the engines
# that enforce read-only themselves. AST classification, never string
# matching. default-features keeps the std dialects (Postgres, SQLite).
sqlparser = "0.62"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Pure-Rust SSH client for the local-forward tunnel (ADR-0069). Chosen over
# shelling out to system ssh/plink so the tunnel has no external-binary
# dependency and dbboard controls host-key verification itself. Rides on the
# `ring` crypto backend already in the tree via rustls-ring, adding NO
# aws-lc-rs (ADR-0034). russh's DEFAULT features include `aws-lc-rs`, which
# pulls `aws-lc-sys` — a C/NASM build that fails on this Windows toolchain and
# is exactly what ADR-0034 forbids — so default-features is off and the pure-
# Rust `ring` backend is selected instead (matching rustls-ring elsewhere).
# `flate2` (compression) and `rsa` (RSA host/user keys) are the other two
# default features, kept. russh-keys was folded into `russh::keys` at 0.50, so
# this single line is the whole dependency.
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
# libsql: the local engine (`core`) plus what a hosted Turso Cloud database
# needs — `remote` for the hrana-over-HTTP client and `tls` for the https it
# runs on (ADR-0111). The two remaining default features stay off: `replication`
# and `sync` are for an embedded replica that keeps a local copy in step with
# the hosted one, which is a different product decision than reading a remote
# database and would put a writable file on disk for a connection the operator
# added as remote.
#
# `tls` pulls `hyper-rustls 0.25`, which is on the rustls 0.22 line whose
# default provider is `ring` — the pure-Rust stack ADR-0034 requires. Verified
# by resolution, not by reading the manifest: `cargo tree -i aws-lc-sys` and
# `-i aws-lc-rs` both match nothing with these features on. The cost is that
# rustls 0.22 and 0.23 now co-exist in the tree; both are ring-backed, so the
# constraint holds, but it is a duplicate to collapse when libsql moves up.
libsql = { version = "0.9", default-features = false, features = [
    "core",
    "remote",
    "tls",
] }
# The official MongoDB driver (issue 0020, ADR-0096). Its default TLS backend
# is `rustls-tls` = rustls/ring, which is the pure-Rust stack ADR-0034 asks
# for; `rustls-tls-aws-lc` is the sibling that would pull `aws-lc-sys` and is
# never selected. The driver offers no native-roots option, so unlike reqwest
# and sqlx above it trusts the webpki bundle — recorded as a known gap in
# ADR-0096 rather than papered over. `redact-errors` replaces server addresses
# and hostnames in driver error strings with `<redacted>`; those strings reach
# the UI, and this project's hosts are business-identifying (ADR-0055). It is
# the same call reqwest's `without_url()` makes in the Firestore adapter: the
# caller already knows which connection it picked.
mongodb = { version = "3.8", features = ["redact-errors"] }
# WHATWG URL parser (already in the tree via reqwest). Used by the
# connection factory to extract a database URL's host:port as the SSH
# forward target and to rewrite it to the loopback forward address
# (ADR-0069) without hand-rolling password-safe URL surgery.
url = "2"
# D1 (and the Anthropic AI provider) talk to REST APIs over HTTPS.
# rustls avoids a system OpenSSL dependency, keeping the Windows build
# self-contained. Roots come from the OS trust store (`*-native-roots`),
# NOT the webpki-bundled Mozilla set: a Windows desktop routinely sits
# behind a TLS-inspecting middlebox (AV like Norton, or a corporate
# proxy) that re-signs every HTTPS connection with a locally-installed
# CA. webpki roots don't include that CA, so the handshake fails with a
# bare "error sending request" and every DB connection breaks. The OS
# store *does* include it (browsers and curl/schannel trust it), so
# native roots make dbboard behave like a normal desktop client. Still
# pure-Rust rustls — rustls-native-certs only reads the store, it does
# not pull in OpenSSL. See ADR-0034.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Neon / Supabase / Aurora DSQL talk the PostgreSQL wire protocol.
# rustls (ring) keeps TLS pure-Rust, matching reqwest above and avoiding
# system OpenSSL. `-native-roots` (not the default `-webpki`) so the
# Postgres-family adapters trust the OS store and survive the same
# TLS-inspecting middleboxes described on `reqwest` above. See ADR-0034.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "mysql"] }
# Consumes the `raw_sql(...).fetch_many(...)` result stream. Also drives
# the dbboard-anthropic SSE stream wrapper (ADR-0026 Decision 4).
futures-util = "0.3"
# Pure-Rust SigV4 primitives for Aurora DSQL IAM token generation
# (ADR-0036). Hand-rolled SigV4 keeps auth off the AWS SDK, which would
# otherwise pull in aws-lc-rs and break the rustls-ring / no-aws-lc-rs
# TLS constraint (ADR-0034). Versions pinned to what Cargo.lock already
# resolves transitively, so no new dependency tree is introduced.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
# now_utc() + compile-time format descriptions for the SigV4 amz-date
# and credential-scope datestamp. `macros` for `format_description!`.
time = { version = "0.3", features = ["formatting", "macros"] }
# Local in-process HTTP backend (Phase 1.5 / ADR-0009). The desktop UI
# talks to this loopback server over the same contract as dbboard-web.
axum = "0.8"
# JSON has no byte type, so Value::Blob is encoded as base64 on the wire.
base64 = "0.22"
# Screen capture of the app's own window for the MCP `capture_window` tool
# (ADR-0108). Chosen over hand-rolling per-platform capture because the
# WebView2 case — the one that decides whether a Tauri window comes out
# black — already works, and it brings only six crates the workspace did
# not already have. Deliberately left on default features: xcap already
# depends on `image` with the `png` codec, which is all a screenshot needs,
# whereas its `image` feature turns on `image/default` — dragging in the
# AVIF and OpenEXR decoders to save a PNG.
xcap = "0.9"
# AFIT (async fn in trait) is not object-safe; the server holds adapters
# as Arc<dyn DatabaseAdapter>. async-trait macros around that until
# object-safe async fns stabilise (ADR-0012).
async-trait = "0.1"
# Connection store file format (ADR-0013). String round-trip only at the
# schema layer; filesystem reads live in the same crate's store module.
toml = "0.8"
# Cross-platform config-dir resolution for connections.toml (ADR-0013).
directories = "5"
# OS keychain backed secret storage for connection tokens (ADR-0013).
# Maps to Windows Credential Manager / macOS Keychain / Linux Secret
# Service uniformly; no system OpenSSL dependency.
keyring = "3"
# Native "Save As" / message dialogs for exporting a result set to CSV
# (ADR-0035). Wraps the OS file picker (Win32 IFileDialog on Windows,
# NSSavePanel on macOS, GTK/xdg-portal on Linux) so the export UX matches
# a normal desktop app. Pure-Rust bindings, MIT/Apache-2.0. On Linux the
# default backend needs GTK3 dev libraries at build time; the maintainer
# builds on Windows where no extra system libs are required.
rfd = "0.17"
# Passphrase-based encryption for the connection bundle export/import
# (ADR-0038). age gives us a battle-tested envelope in one dependency:
# scrypt KDF + ChaCha20-Poly1305 AEAD + a versioned, authenticated file
# format, so dbboard hand-rolls no crypto. Passphrase (scrypt) recipient
# only; the X25519 recipient path is unused but comes with the crate.
# Pure Rust, MIT/Apache-2.0, no system OpenSSL. default-features = false
# drops the optional `armor`/`async`/`plugin`/`ssh` surface — the bundle
# is a binary blob written straight to a user-chosen path.
age = { version = "0.11", default-features = false }
# Scrub the decrypted-bundle plaintext buffer from memory after use
# (ADR-0038). age already zeroizes its own SecretString key material;
# this covers the intermediate JSON byte buffer that briefly holds the
# resolved secrets before/after the age boundary. Already in the tree
# transitively via age; pinned here to depend on it directly.
zeroize = "1"
# tempfile-based integration tests for dbboard-config's filesystem layer.
tempfile = "3"
# Official Rust MCP SDK (ADR-0046). `dbboard-mcp` uses it to expose the
# read-only tool surface over a stdio transport so an external AI agent
# (Claude Desktop / Claude Code) can drive dbboard's configured
# connections. `server` = the `ServerHandler` + service layer, `macros`
# = the `#[tool]`/`#[tool_router]`/`#[tool_handler]` proc-macros,
# `transport-io` = the stdio transport (stdout is the MCP channel, so all
# logging goes to stderr). Pinned to 2.2.0 (the v2 model/protocol line).
rmcp = { version = "2.2", features = ["server", "macros", "transport-io"] }
# JSON Schema derivation for the MCP tool parameter structs. rmcp 2.x
# requires schemars 1.0 (a 0.8 `JsonSchema` will not satisfy the bound).
schemars = "1"
# Structured, level-filtered logging for the headless MCP server. Emitted
# to stderr only — stdout carries the JSON-RPC frames. `tracing` is also
# rmcp's own logging facade, so this shares its instrumentation.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pure-Rust mock HTTP server for dbboard-anthropic's round-trip tests.
# Dev-dep only — the production code never depends on it.
wiremock = "0.6"
# RS256 signing for the Firestore service-account grant (ADR-0093). Already
# in the tree via rustls-ring, so this adds no new dependency — which is the
# point: the obvious alternative (`rsa`) carries RUSTSEC-2023-0071, a timing
# sidechannel on exactly the private-key operation this performs. ring's RSA
# signing is constant-time and is the same backend ADR-0034 already committed
# to; `aws-lc-rs` stays out of the tree.
ring = "0.17"
# Firestore's tests need a private key to sign with, and a committed one is
# both a `scripts/pii-scan.sh` blocking finding and wrong in a public repo —
# so the tests generate a throwaway key at runtime. `rsa` is the only pure-Rust
# RSA *keygen* in the ecosystem; it is a dev-dependency only, where
# RUSTSEC-2023-0071 cannot reach a real credential. `rand` 0.8 is the version
# whose `rand_core` matches rsa 0.9.
rsa = "0.9"
rand = "0.8"

# Generating a 2048-bit RSA key for the Firestore credential tests runs
# `num-bigint-dig` unoptimised in a debug build, which turns a sub-second
# operation into tens of seconds. Optimising just this one dependency keeps
# `cargo test` usable without giving up debug info anywhere else.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
